openapi: 3.0.1
info:
  title: FlexDeploy REST v2 Api
  description: Index for available v2 rest APIs in FlexDeploy. Uses basic authentication
  version: '9.0'
servers:
- url: /flexdeploy/rest
  description: Local FlexDeploy server
security:
- Basic:
  - write:read
tags:
- name: Integration AccountProvider
  description: "Integration AccountProvider can be accessed, created, deleted, and\
    \ modified through this API."
- name: Administration - Admin Operations
  description: Flexdeploy application logs can be downloaded through this API.
- name: Administration - Resource Type
  description: Resource Types can be accessed through this API.
- name: Administration - Property Key Definition
  description: Property Key Definitions can be accessed through this API.
- name: Administration - Property Set
  description: Property Sets can be accessed through this API.
- name: Security - Credential
  description: "Credentials can be accessed, created, and modified through this API."
- name: Security - Credential Store Provider
  description: "Credential Store Providers can be accessed, created, and modified\
    \ through this API."
- name: Security - Credential Store
  description: "Credential Stores can be accessed, created, and modified through this\
    \ API."
- name: Security - Group Member
  description: Assigns/Unassigns Group to User with the provided data.
- name: Group
  description: "Groups can be accessed, created, and modified through this API."
- name: Security - User
  description: "Users can be accessed, created, and modified through this API."
- name: Attachment
  description: Upload and download attachments
- name: Change Ticket
  description: "Change Tickets (ServiceNow, BMC RemedyForce) can be accessed, created,\
    \ deleted, and modified through this API."
- name: Configuration
  description: FlexDeploy Configurations can be exported and imported through this
    API.
- name: Administration - Outgoing Webhook Event Listener
  description: "Event Listeners can be accessed and modified through this API allowing\
    \ the retrieval, creation, complete update, partial update, and deletion of Event\
    \ Listeners."
- name: Administration - Outgoing Webhook Event Message Listener
  description: Outgoing Webhook Event Message Listeners can be accessed through this
    API. Outgoing Webhook Event Messages can also be resubmitted.
- name: Administration - Scheduled Event Function
  description: "Scheduled Event Functions can be accessed and modified through this\
    \ API allowing the retrieval, creation, complete update, and partial update."
- name: Administration - Scheduled Event Message Function
  description: Scheduled Event Message Functions can be accessed through this API.
    Scheduled Event Messages can also be resubmitted.
- name: Folder
  description: "Folders can be accessed, created, deleted, and modified through this\
    \ API."
- name: Pipeline Attachment
  description: Download and upload Pipeline Attachments
- name: Plugin Execution
  description: Individual Plugin Executions can be accessed through this API.
- name: Project - Branch
  description: "Project Branches can be accessed, created, and modified through this\
    \ API."
- name: Project - Files
  description: "Project Objects can be accessed, created, deleted, discovered, evaluated,\
    \ and modified through this API."
- name: Project
  description: "Projects can be accessed, created, deleted, and modified through this\
    \ API."
- name: Project - Template
  description: Project Templates can be used to create several projects from a CSV
    file through this API.
- name: Project - Test Configuration
  description: "Project Test Configurations can be accessed, created, deleted, and\
    \ modified through this API."
- name: Project - Package
  description: "Project Packages can be accessed, created, deleted, and modified through\
    \ this API."
- name: Project - Artifact
  description: Artifacts can be accessed through this API.
- name: Project - Version
  description: Project Versions can be accessed through this API.
- name: Release Content
  description: "Releases Projects can be accessed, created, and modified through this\
    \ API."
- name: Release Property
  description: "Releases Properties can be accessed, created, and modified through\
    \ this API."
- name: Release
  description: "Releases can be accessed, created, and modified through this API."
- name: Release Snapshots
  description: Release Snapshots can be accessed and created through this API.
- name: SCM Revisions
  description: SCM Revisions can be accessed through this API.
- name: Search
  description: Users can search FlexDeploy through this API.
- name: Tasks
  description: "Tasks can be searched, approved, rejected, assigned, and unassigned\
    \ through this API."
- name: Topology - Endpoint
  description: "Endpoints can be accessed, created, modified, and tested through this\
    \ API"
- name: Topology - Environment
  description: "Environments can be accessed and modified through this API allowing\
    \ the retrieval, creation, complete update, and partial update of environments."
- name: Topology - Integration Instance Properties
  description: Integration Instance Properties can be accessed and modified through
    this API.
- name: Topology - Integration Instance
  description: "Integration Instances can be accessed, created, and modified through\
    \ this API."
- name: Topology - Target Group
  description: "Target Groups can be accessed, created, and modified through this\
    \ API."
- name: Topology - Target Properties
  description: Target properties can be accessed and modified through this API.
- name: Topology - Target
  description: "Targets can be accessed, created, modified, and deleted through this\
    \ API."
- name: Topology - Test Instance Properties
  description: Test Instance Properties can be accessed and modified through this
    API.
- name: Topology - Test Instance
  description: "Test Instances can be accessed, created, and modified through this\
    \ API."
- name: Administration - Incoming Webhook Message
  description: Incoming Webhook Messages can be accessed through this API. Incoming
    Webhook Messages can also be resubmitted.
- name: Administration - Incoming Webhook Function
  description: "Incoming Webhook Functions can be accessed and modified through this\
    \ API allowing the retrieval, creation, complete update, partial update, and deletion\
    \ of Incoming Webhook Functions."
- name: Administration - Incoming Webhook Provider
  description: "Incoming Webhook Providers can be accessed and modified through this\
    \ API allowing the retrieval, creation, complete update, partial update, and deletion\
    \ of Incoming Webhook Providers."
- name: Workflow
  description: Users can access workflow information through this API.
- name: Workflow Version
  description: Users can access workflow version information through this API.
- name: Project - Execution
  description: Workflow Executions can be accessed through this API.
- name: Project - Backup
  description: Backups can be accessed through this API.
- name: Workflow Execution
  description: Workflow Executions can be accessed through this API.
- name: Workflow Execution - Report
  description: Workflow Execution Reports can be accessed through this API.
- name: Workflow Request
  description: Workflow Requests can be accessed through this API.
- name: Flex Work Item
  description: "Flex Work Items can be accessed, created, deleted, and modified through\
    \ this API."
- name: Work Item
  description: "Work Items (Jira, Azure Boards, GitLab) can be accessed, created,\
    \ deleted, and modified through this API."
paths:
  /v2/integrations/account:
    post:
      tags:
      - Integration AccountProvider
      summary: Creates a new account provider with attributes from the given JSON
        body
      operationId: createAccountProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProviderDataObject'
      responses:
        "201":
          description: Account Provider was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProviderDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "500":
          description: Unexpected internal server error
  /v2/integrations/account/{accountProviderId}:
    get:
      tags:
      - Integration AccountProvider
      summary: Find an account provider detail with the given id
      operationId: getAccountProviderById
      parameters:
      - name: accountProviderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Account provider detail was found with the given accountProviderId
            and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProviderDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure (no access to resource)
        "404":
          description: Account Provider not found
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Integration AccountProvider
      summary: Updates all attributes of a Account Provider with the given Id based
        on the attributes of a JSON object parameters
      operationId: updateAccountProvider
      parameters:
      - name: accountProviderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProviderDataObject'
      responses:
        "200":
          description: Account Provider was found and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProviderDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Account Provider not found
        "500":
          description: Unexpected internal server error
    delete:
      tags:
      - Integration AccountProvider
      summary: Deletes an existing Account Provider.
      operationId: deleteAccountProvider
      parameters:
      - name: accountProviderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Account Provider was found and deleted
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Account Provider not found
        "500":
          description: Unexpected internal server error
    patch:
      tags:
      - Integration AccountProvider
      summary: Updates an existing Account Provider with the information passed through
        a JSON object. If an attribute of the JSON is null it will not be updated.
      operationId: patchAccountProvider
      parameters:
      - name: accountProviderId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProviderDataObject'
      responses:
        "200":
          description: Account Provider was found and patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProviderDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Account Provider not found
        "500":
          description: Unexpected internal server error
  /v2/administration/adminoperations/logFileDownload:
    get:
      tags:
      - Administration - Admin Operations
      summary: Download a single log file for the given fileName
      operationId: logFileDownload
      parameters:
      - name: fileName
        in: query
        schema:
          type: string
      - name: numberOfLines
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Log file found and downloaded
          content:
            text/plain:
              schema:
                type: string
                format: byte
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "404":
          description: FileName not found
        "500":
          description: Unexpected internal server error
  /v2/administration/adminoperations/logFileDownloadAll:
    get:
      tags:
      - Administration - Admin Operations
      summary: Download all the Logs in zip format
      operationId: logFileDownloadAll
      parameters:
      - name: withThreadDumps
        in: query
        schema:
          type: boolean
      responses:
        "200":
          description: Logs found and downloaded
          content:
            text/plain:
              schema:
                type: string
                format: byte
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "500":
          description: Unexpected internal server error
  /v2/administration/resourcetype/{Id}:
    get:
      tags:
      - Administration - Resource Type
      operationId: getResourceType
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: default response
          content:
            application/json: {}
    put:
      tags:
      - Administration - Resource Type
      operationId: putResourceType
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTypeDataObject'
      responses:
        default:
          description: default response
          content:
            application/json: {}
    delete:
      tags:
      - Administration - Resource Type
      operationId: deleteResourceType
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: default response
          content:
            application/json: {}
    patch:
      tags:
      - Administration - Resource Type
      operationId: patchResourceType
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTypeDataObject'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v2/administration/resourcetype:
    get:
      tags:
      - Administration - Resource Type
      summary: Search Resource Types
      operationId: searchResourceTypes
      parameters:
      - name: resourceTypeId
        in: query
        schema:
          type: integer
          format: int64
      - name: resourceTypeName
        in: query
        schema:
          type: string
      - name: description
        in: query
        schema:
          type: string
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: ownerType
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Matching Resource Types returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResourceType'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "500":
          description: Unexpected internal server error
    post:
      tags:
      - Administration - Resource Type
      summary: Create Resource Type
      operationId: postResourceType
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceTypeDataObject'
      responses:
        "201":
          description: Resource Type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "404":
          description: Endpoint not found
        "500":
          description: Unexpected internal server error
  /v2/administration/propertykeydefinition:
    get:
      tags:
      - Administration - Property Key Definition
      summary: Search Property Key Definitions
      operationId: searchPropertyKeyDefinitions
      parameters:
      - name: propertyDefinitionId
        in: query
        schema:
          type: integer
          format: int64
      - name: propertyKeyName
        in: query
        schema:
          type: string
      - name: displayName
        in: query
        schema:
          type: string
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: propertyScope
        in: query
        schema:
          type: string
      - name: isCustom
        in: query
        schema:
          type: boolean
      - name: description
        in: query
        schema:
          type: string
      - name: isMultiSelect
        in: query
        schema:
          type: boolean
      - name: isAllowsVariant
        in: query
        schema:
          type: boolean
      - name: IsDefaultExpression
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Matching Property Key Definitions returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertyKeyDefinition'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "500":
          description: Unexpected internal server error
    post:
      tags:
      - Administration - Property Key Definition
      summary: Creates a new Property Key Definition with attributes from the given
        JSON body
      operationId: createPropertyKeyDefinition
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyKeyDefinitionDataObject'
      responses:
        "201":
          description: Property Key Definition was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyKeyDefinitionDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "500":
          description: Unexpected internal server error
  /v2/administration/propertykeydefinition/{Id}:
    get:
      tags:
      - Administration - Property Key Definition
      summary: Find a Property Key Definition with the given Id
      operationId: getPropertyKeyDefinition
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Property Key Definition was found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyKeyDefinitionDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "404":
          description: Environment not found
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Administration - Property Key Definition
      summary: Updates an existing Property Key Definition with the information passed
        through a JSON object
      operationId: updatePropertyKeyDefinition
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyKeyDefinitionDataObject'
      responses:
        "200":
          description: Property Key Definition was found and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyKeyDefinitionDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Property Key Definition not found
        "500":
          description: Unexpected internal server error
    patch:
      tags:
      - Administration - Property Key Definition
      summary: "Updates an existing Property Key Definition with the information passed\
        \ through a JSON object. If an attribute of the JSON is null, it will not\
        \ be updated."
      operationId: patchPropertyKeyDefinition
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PropertyKeyDefinitionDataObject'
      responses:
        "200":
          description: Property Key Definition was found and patched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyKeyDefinitionDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Property Key Definition not found
        "500":
          description: Unexpected internal server error
  /v2/administration/propertyset/{Id}:
    get:
      tags:
      - Administration - Property Set
      summary: Find a Property Set with the given Id
      operationId: getPropertySet
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Property Set was found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySetDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "404":
          description: Environment not found
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Administration - Property Set
      summary: Updates an existing Workflow Property Set with the information passed
        through a JSON object
      operationId: updateWorkflowPropertySet
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertySetDataObject'
      responses:
        "200":
          description: Property Set was found and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySetDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Property Set not found
        "500":
          description: Unexpected internal server error
  /v2/administration/propertyset:
    get:
      tags:
      - Administration - Property Set
      summary: Search Property Sets
      operationId: searchPropertySets
      parameters:
      - name: propertySetId
        in: query
        schema:
          type: integer
          format: int64
      - name: propertySetName
        in: query
        schema:
          type: string
      - name: ownerId
        in: query
        schema:
          type: integer
          format: int64
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: ownerType
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Matching Property Sets returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertySet'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "500":
          description: Unexpected internal server error
  /v2/administration/security/credential/{credentialId}:
    delete:
      tags:
      - Security - Credential
      summary: Deletes an existing Credential.
      operationId: deleteCredential
      parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Credential was found and deleted
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Credential not found
        "500":
          description: Unexpected internal server error
  /v2/administration/security/credential/downloadPublicKey:
    post:
      tags:
      - Security - Credential
      summary: "Downloads a public key based on the information passed through a JSON\
        \ object. Credential id must be of type SSH Key, and private key must be encoded\
        \ to Base64 if passed."
      operationId: downloadPublicKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPrivateKeyPojo'
      responses:
        "200":
          description: Public Key retrieved successfully.
          content:
            application/octet-stream: {}
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "500":
          description: Unexpected internal server error
  /v2/administration/security/credential/downloadPublicKey/{credentialId}:
    get:
      tags:
      - Security - Credential
      summary: Downloads a public key based on the credential id. Credential must
        be of type SSH Key.
      operationId: downloadPublicKey_1
      parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Public Key retrieved successfully.
          content:
            application/octet-stream: {}
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "500":
          description: Unexpected internal server error
  /v2/administration/security/credential/{Id}:
    get:
      tags:
      - Security - Credential
      summary: Find a Credential with the given Id
      operationId: getCredential
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Credential was found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "404":
          description: Environment not found
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Security - Credential
      summary: Updates all attributes of an Credential with the given Id based on
        the attributes of a JSON object parameters
      operationId: putCredential
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialDataObject'
      responses:
        "200":
