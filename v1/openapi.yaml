openapi: 3.0.1
info:
  title: FlexDeploy REST v1 Api
  description: Index for available v1 rest APIs in FlexDeploy.  Uses basic authentication.
    Some of these are marked as deprecated below and will be altered or removed in
    the FlexDeploy 8.0 release. The remainder continue to be supported.
  version: '9.0'
servers:
- url: /flexdeploy/rest
  description: Local FlexDeploy server
security:
- Basic:
  - write:read
tags:
- name: Administration - Security Group
  description: "Groups can be accessed and modified through this API using four services:\
    \ GET, POST, PUT, and PATCH. These four services allow for the retrieval, creation,\
    \ complete update, and partial update of groups."
- name: Administration - User
  description: "Users can be accessed and modified through this API using four services:\
    \ GET, POST, PUT, and PATCH. These four services allow for the retrieval, creation,\
    \ complete update, and partial update of users."
- name: Folder
  description: Folders can be accessed and searched through this API.
- name: Project - Package
  description: "Project Packages can be accessed, searched, updated, and deleted through\
    \ this API."
- name: Project - Properties
  description: Project Properties can be accessed and updated through this API.
- name: Project
  description: "Projects can be created, accessed, searched, updated, and executed\
    \ through this API."
- name: Project - Branch
  description: "Project Branches can be created, accessed, searched, and updated,\
    \ and file catalog discovery operations can be executed through this API."
- name: Project - Version
  description: "Project Versions can be accessed, searched, and their artifacts can\
    \ be downloaded through this API."
- name: Release Gates
  description: Release Gates can be accessed through this API.
- name: Release
  description: "Releases can be accessed, created, and modified through this API.\
    \ For PATCH and PUT operations, here are the guidelines:<br /><br />1. Cannot\
    \ add a project without all required property values for that property set.<br\
    \ /><br />2. Cannot end a release if there are running pipeline executions.<br\
    \ /><br />3. PipelineName or PipelineId must be provided to set Pipeline Properties.<br\
    \ /><br />4. Adding a project requires a Project ID and Project Stream ID.<br\
    \ /><br />5. When adding a new project to the release, if no buildEnvironmentId\
    \ is passed, then the service will attempt to initialize the BuildEnvironmentId\
    \ if only one build Target is associated to it.<br /><br />6. For Package-based\
    \ Deployment Projects, must provide packageName.<br /><br />7. Examples of valid\
    \ cron expressions: https://www.freeformatter.com/cron-expression-generator-quartz.html"
- name: Release Snapshots
  description: "Release Snapshots can be accessed, created, and executed through this\
    \ API."
- name: Approval Tasks
  description: "Approval Tasks can be accessed through this API. Each approval task\
    \ can be one of two different types: Release and Project. The Response will vary\
    \ accordingly."
- name: Scheduled Tasks API
  description: Scheduled Tasks can be accessed through this API using GET. This API
    can also run and cancel scheduled tasks based on task id and other parameters.
- name: Topology - Targets API
  description: "Targets can be accessed and modified through this API using three\
    \ services: GET, PUT, and PATCH. These three services allow for the retrieval,\
    \ complete update, and partial update of targets."
- name: Topology - Integrations Account
  description: "Account instances can be accessed and modified through this API using\
    \ four services: GET, POST, PUT, and PATCH. These four services allow for the\
    \ retrieval, creation, complete update, and partial update of account instances."
- name: Topology - Integration CMSInstance
  description: "Change Management System can be accessed and modified through this\
    \ API using four services: GET, POST, PUT, and PATCH. These four services allow\
    \ for the retrieval, creation, complete update, and partial update of groups."
- name: Topology - Integrations Issue Tracking System Instance
  description: "Issue Tracking Systems can be accessed and modified through this API\
    \ using four services: GET, POST, PUT, and PATCH. These four services allow for\
    \ the retrieval, creation, complete update, and partial update of Issue Tracking\
    \ Systems."
- name: Topology - Integrations SCMInstance
  description: "SCM Instances can be accessed and modified through this API using\
    \ four services: GET, POST, PUT, and PATCH. These four services allow for the\
    \ retrieval, creation, complete update, and partial update of SCM Instances."
- name: Current User Profile
  description: Provide information about current user.
- name: Workflow Execution
  description: Workflow Executions can be accessed through this API.
- name: Workflow Request
  description: Workflow Requests can be accessed through this API.
paths:
  /v1/administration/security/group:
    get:
      tags:
      - Administration - Security Group
      summary: This GET service will return a list of groups in the form of JSON objects
        based on the query parameters group name. Groups are only returned if they
        match all of the specified query parameters. If no query parameters are given
        this request will return the entire list of groups.
      operationId: searchGroups
      parameters:
      - name: groupName
        in: query
        description: "The name of the group. It's case-insensitive, searching by groupName=NAME\
          \ is the same as searching by groupName=name"
        allowEmptyValue: true
        schema:
          type: string
        example: ExecuteWLST
      responses:
        "200":
          description: Search successful and results returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFdGroupDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "500":
          description: Unexpected internal server error
    post:
      tags:
      - Administration - Security Group
      summary: This POST service will create a new group with the same attributes
        as the given JSON object.
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FdGroupDataObject'
      responses:
        "201":
          description: Group was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdGroupDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "500":
          description: Unexpected internal server error
  /v1/administration/security/group/{Id}:
    get:
      tags:
      - Administration - Security Group
      summary: This GET service will find a group with the given Id and return the
        JSON representation of the object.
      operationId: getGroup
      parameters:
      - name: Id
        in: path
        description: This is a URL parameter for the Id which is used to find and
          return a group
        required: true
        schema:
          type: integer
          format: int64
        example: 6346
      responses:
        "200":
          description: Group was found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdGroupDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Group not found)
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Administration - Security Group
      summary: This PUT service will update all attributes of a group with the given
        Id based on the attributes of a JSON object parameters.
      operationId: updateGroup
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FdGroupDataObject'
      responses:
        "200":
          description: Group was found and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdGroupDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Group not found
        "500":
          description: Unexpected internal server error
    patch:
      tags:
      - Administration - Security Group
      summary: This PATCH service will update an existing group with the information
        passed through a JSON object. If an attribute of the JSON is null it will
        not be updated in the group.
      operationId: patchGroup
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FdGroupDataObject'
      responses:
        "200":
          description: Group was found and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FdGroupDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Group not found
        "500":
          description: Unexpected internal server error
  /v1/administration/security/user:
    get:
      tags:
      - Administration - User
      summary: "This GET service will return a list of users in the form of JSON objects\
        \ based on the query parameters user name, first name, last name and group\
        \ id. Users are only returned if they match all of the specified query parameters.\
        \ Maximum of 50 items will be returned if limit is not provided."
      operationId: searchUsers
      parameters:
      - name: userName
        in: query
        description: "The user name of the user, it follows Equals search."
        schema:
          type: string
      - name: lastName
        in: query
        description: "The last name of the user, Contains ignore case search."
        schema:
          type: string
      - name: firstName
        in: query
        description: "The first name of the user, Contains ignore case search."
        schema:
          type: string
      - name: groupId
        in: query
        description: Find users that are member of specific group.
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Search successful and results returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "500":
          description: Unexpected internal server error
    post:
      tags:
      - Administration - User
      summary: This POST service will create a new user with the same attributes as
        the given JSON object.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPojo'
      responses:
        "201":
          description: User was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "500":
          description: Unexpected internal server error
  /v1/administration/security/user/{Id}:
    get:
      tags:
      - Administration - User
      summary: This GET service will find a user with the given Id and return the
        JSON representation of the object.
      operationId: findUserById
      parameters:
      - name: Id
        in: path
        description: This is a URL parameter for the Id which is used to find and
          return a user
        required: true
        schema:
          type: integer
          format: int64
        example: 14048079
      responses:
        "200":
          description: User was found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: User not found)
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Administration - User
      summary: This PUT service will update all attributes of a user with the given
        Id based on the attributes of a JSON object parameters. Attributes that are
        not provided will become their default values.
      operationId: updateUser
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UserPojo'
      responses:
        "200":
          description: User was found and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: User not found
        "500":
          description: Unexpected internal server error
    patch:
      tags:
      - Administration - User
      summary: "This PATCH service will update an existing user with the information\
        \ passed through a JSON object. If an attribute of the JSON is null it will\
        \ not be updated in the user. Groups that are included in a PATCH will be\
        \ added, but existing groups will still remain."
      operationId: patchUser
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UserPojo'
      responses:
        "200":
          description: User was found and updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: User not found
        "500":
          description: Unexpected internal server error
  /v1/folder/{Id}:
    get:
      tags:
      - Folder
      summary: Find a Folder with the given Id
      description: This GET service will find a Folder by Id and return a JSON representation
        of it.
      operationId: getFolder
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Folder was found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Folder not found
        "500":
          description: Unexpected internal server error
  /v1/folder:
    get:
      tags:
      - Folder
      summary: Search Folders
      description: "This GET service will find a folder by querying based on a folder\
        \ name and return the JSON representations of the objects satisfying the query.\
        \ If no query parameters are given this request will return the entire list\
        \ of folders. Note: The query parameters are not case sensitive. Searching\
        \ by folderName=NAME is the same as searching by folderName=name."
      operationId: searchFolders
      parameters:
      - name: folderName
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Matching Folders returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFolderPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "500":
          description: Unexpected internal server error
  /v1/project/{projectId}/package:
    post:
      tags:
      - Project - Package
      summary: Creates a Project Package
      description: "This POST service will create a new package with the same attributes\
        \ as the given JSON object. Note: packagePath element is only used for Salesforce\
        \ projects."
      operationId: createPackage
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageDetailsRequestPojo'
      responses:
        "201":
          description: Project Package was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetailsResponsePojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project not found
        "500":
          description: Unexpected internal server error
  /v1/project/{projectId}/package/{packageName}:
    get:
      tags:
      - Project - Package
      summary: Find a Project Package with the given Name for a given projectId
      description: "This method will find a package with the given name in the given\
        \ project and return the JSON representation of the package. Note: packagePath\
        \ element is only used for Salesforce projects."
      operationId: getPackage
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: packageName
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Project Package was found and returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetailsResponsePojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project Package not found
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Project - Package
      summary: Updates a Project Package - replacing any previous content with the
        new contents
      description: "This PUT service will replace all attributes of a given package\
        \ with the attributes of the provided JSON request. Note: packagePath element\
        \ is only used for Salesforce projects."
      operationId: updatePackage
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: packageName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageDetailsRequestPojo'
      responses:
        "200":
          description: Project Package was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetailsResponsePojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project or Package not found
        "500":
          description: Unexpected internal server error
    delete:
      tags:
      - Project - Package
      summary: Deletes a Project Package
      description: "This method will delete a package with the given name in the given\
        \ project. There is no response message. If package is not present (was already\
        \ deleted), no error code will be returned."
      operationId: deletePackage
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: packageName
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Project Package was deleted
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project not found
        "500":
          description: Unexpected internal server error
    patch:
      tags:
      - Project - Package
      summary: Patches a Project Package - appending any provided files to the existing
        package
      description: "This PATCH service will update an existing package with the information\
        \ passed through a JSON object. If an attribute of the JSON is null, it will\
        \ not be updated in the package. Any new files included in the request will\
        \ be appended to the list of files already in the package. Note: packagePath\
        \ element is only used for Salesforce projects."
      operationId: patchPackage
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: packageName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageDetailsRequestPojo'
      responses:
        "200":
          description: Project Package was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetailsResponsePojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project or Package not found
        "500":
          description: Unexpected internal server error
  /v1/project/{projectid}/property:
    get:
      tags:
      - Project - Properties
      summary: Gets the Project Properties for a project
      description: This GET service will find list of Project Properties associated
        with the given Project and return the JSON representation of the list.
      operationId: getPropertiesByProjectId
      parameters:
      - name: projectid
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Project Properties returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPropertyValuePojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project not found
        "500":
          description: Unexpected internal server error
    put:
      tags:
      - Project - Properties
      summary: Replaces the Project Properties for a project
      description: "This PUT service will update the propertyValue of each property\
        \ in the project associated with the Project id specified in the URL. Note:\
        \ Any properties not passed in will be reset to their default values."
      operationId: updateProjectProperties
      parameters:
      - name: projectid
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PropertyValuePojo'
      responses:
        "200":
          description: Project Properties replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPropertyValuePojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project not found
        "500":
          description: Unexpected internal server error
    patch:
      tags:
      - Project - Properties
      summary: Updates the Project Properties for a project
      description: This PATCH service will update an existing Project's Properties
        with the information passed through a JSON object. If a property is not listed
        it will not be updated in the Project and will remain as is.
      operationId: patchProjectProperties
      parameters:
      - name: projectid
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PropertyValuePojo'
      responses:
        "200":
          description: Project Properties updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPropertyValuePojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure(no access to resource)
        "404":
          description: Project not found
        "500":
          description: Unexpected internal server error
  /v1/project/{Id}/build:
    post:
      tags:
      - Project
      summary: Builds a Project
      operationId: buildProject
      parameters:
      - name: Id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/BuildProjectRequestPojo'
      responses:
        "201":
          description: Project Built
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRequestDataObject'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "404":
          description: Project not found
        "500":
          description: Unexpected internal server error
  /v1/project:
    get:
      tags:
      - Project
      summary: Search Projects
      operationId: searchProjects
      parameters:
      - name: projectName
        in: query
        schema:
          type: string
      - name: folderId
        in: query
        schema:
          type: integer
          format: int64
      - name: isActive
        in: query
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Matching Projects returned. Maximum of 50 items will be returned
            if limit is not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authentication failure(no access to resource)
        "500":
          description: Unexpected internal server error
    post:
      tags:
      - Project
      summary: Creates a new Project with attributes from the given JSON body
      operationId: createProject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPojo'
      responses:
        "201":
          description: Project was created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPojo'
        "400":
          description: Bad request
        "401":
          description: Authentication failure
        "403":
          description: Authorization failure (no access to resource)
        "500":
          description: Unexpected internal server error
  /v1/project/{Id}/deploy:
    post:
      tags:
      - Project
      summary: Deploys a Project
      operationId: deployProject
      parameters:
      - name: Id
        in: path
        required: true
